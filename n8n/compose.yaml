version: "3"
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=AtechPro
      - N8N_BASIC_AUTH_PASSWORD=KuroAtechPro2002
    volumes:
      - E:/n8n_data:/home/node/.n8n
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  n8n_data: