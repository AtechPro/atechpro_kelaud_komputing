version: '3.8'
services:
  kali-linux:
    image: lscr.io/linuxserver/kali-linux:latest
    container_name: kali-linux
    security_opt:
      - seccomp=unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBFOLDER=/ # optional
      - TITLE="Kali Linux" # optional
    ports:
      - "3500:3000"
      - "3600:3001"
    devices:
      - /dev/dri:/dev/dri # optional
    shm_size: 4gb # Changed to 4gb
    restart: unless-stopped