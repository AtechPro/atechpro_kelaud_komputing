version: '3.9'

services:
  kaligui:
    build: .
    container_name: kaligui_desktop
    ports:
      - "0.0.0.0:8080:8080"   # noVNC web interface (http://localhost:8080/vnc.html)
      - "5901:5901"           # VNC desktop access (optional, for native VNC clients)
      - "0.0.0.0:2222:22"     # SSH access (connect via ssh root@localhost -p 2222)
    volumes:
      - kalidata:/root         # Persist home directory (root)
    restart: unless-stopped
    cap_add:
      - NET_ADMIN              # Needed for network tools like nmap, tcpdump
      - NET_RAW                # Required by some networking utilities
    privileged: true          # Gives full access to host devices (use cautiously)

volumes:
  kalidata:
    # Optional: specify external driver or options here if needed